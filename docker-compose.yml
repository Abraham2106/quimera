services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: quimera
      POSTGRES_PASSWORD: quimera
      POSTGRES_DB: quimera
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quimera -d quimera"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s