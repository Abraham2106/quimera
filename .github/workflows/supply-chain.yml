name: Supply chain

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # firma keyless de cosign con OIDC de GitHub
    steps:
      - name: Checkout
        uses: 11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup pnpm
        uses: 7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0

      - name: Setup Node.js
        uses: 49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: CycloneDX SBOM
        run: pnpm dlx @cyclonedx/cyclonedx-npm@7.0.1 --output-file sbom.cdx.json

      - name: Install cosign
        uses: 2e2f661cd4be3a4b891a882064e49d0fed4b7b88 # v3.9.0

      - name: Sign SBOM (keyless)
        run: cosign sign-blob --yes sbom.cdx.json --output-signature sbom.cdx.json.sig --output-certificate sbom.cdx.json.pem

      - name: Upload signed SBOM
        uses: ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: |
            sbom.cdx.json
            sbom.cdx.json.sig
            sbom.cdx.json.pem
          if-no-files-found: error

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: 11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: e8e594e8799b6bc05d33c13d3d14e484b7b9cbc0 # v3.29.4
        with:
          languages: javascript-typescript

      - name: Analyze
        uses: e8e594e8799b6bc05d33c13d3d14e484b7b9cbc0 # v3.29.4
