name: CI

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://quimera:quimera@127.0.0.1:5432/quimera
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: quimera
          POSTGRES_PASSWORD: quimera
          POSTGRES_DB: quimera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quimera -d quimera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Isolation
        run: pnpm test:isolation

      - name: Security
        run: pnpm test:security
